[project]
name = "trikon"
version = "0.0.1"
description = "Verification layer for autonomous AI coding agents. Blast radius + targeted tests + policy engine + structured verdicts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Surya" }]
keywords = [
    "ai-agents",
    "code-verification",
    "test-impact-analysis",
    "guardrails",
    "governance",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    # AST + dep graph
    "jedi>=0.19",           # cross-file symbol resolution
    "libcst>=1.5",          # concrete syntax tree preserving formatting
    "unidiff>=0.7.5,<1",    # unified-diff string parser (change_intel.diff_parser)
    # Test selection + execution
    "pytest>=8.0",
    "coverage>=7.6",
    # Policy DSL
    "pyyaml>=6.0",
    "pydantic>=2.9",
    # CLI + integrations
    "typer>=0.14",
    "rich>=13.9",
    "gitpython>=3.1",
    # MCP server integration
    # "mcp>=1.0",           # uncomment when integrations are wired
]

[project.optional-dependencies]
github = ["pygithub>=2.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-benchmark>=4,<5",   # perf gate for change_intel benchmarks
    "hypothesis>=6.100,<7",     # property-based tests
    "networkx>=3,<4",           # reference impl for DepGraph model-based tests
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
trikon = "trikon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trikon"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line-too-long handled by formatter

[tool.ruff.lint.per-file-ignores]
# Typer's canonical pattern is `param: T = typer.Option(default, ...)` in the
# function signature. Ruff B008 (function-call-in-default-argument) fires on
# that pattern and every Path.cwd() default we hand to it. The rule does not
# fit Typer — silence it for the CLI module only.
"trikon/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jedi.*", "libcst.*", "unidiff.*", "git.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["trikon"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests requiring git / docker / sample_repo",
    "slow: benchmarks and long-running tests",
]
