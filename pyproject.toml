[project]
name = "trikon"
version = "0.5.0"
description = "Verification layer for autonomous AI coding agents. Blast radius + targeted tests + policy engine + structured verdicts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Surya" }]
keywords = [
    "ai-agents",
    "code-verification",
    "test-impact-analysis",
    "guardrails",
    "governance",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    # AST + dep graph
    "jedi>=0.19",           # cross-file symbol resolution
    "libcst>=1.5",          # concrete syntax tree preserving formatting
    "unidiff>=0.7.5,<1",    # unified-diff string parser (change_intel.diff_parser)
    # Test selection + execution
    "pytest>=8.0",
    "coverage>=7.6",
    # Policy DSL
    "pyyaml>=6.0",
    "pydantic>=2.9",
    # CLI + integrations
    "typer>=0.14",
    "rich>=13.9",
    "gitpython>=3.1",
    # Verification runner — Docker sandbox client (Phase 2)
    "docker>=7,<8",
    # MCP server integration (trikon mcp serve)
    "mcp>=2,<3",
]

[project.optional-dependencies]
github = ["pygithub>=2.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-benchmark>=4,<5",   # perf gate for change_intel benchmarks
    "hypothesis>=6.100,<7",     # property-based tests
    "networkx>=3,<4",           # reference impl for DepGraph model-based tests
    "ruff>=0.7",
    "mypy>=1.13",
    "respx>=0.21,<0.22",        # httpx mocking for trikon_cloud/fargate_runner tests
    "moto>=5,<6",               # AWS control-plane mocking for trikon_cloud/webhook_receiver tests
    "aws-cdk-lib>=2.170,<3",    # CDK stack for trikon_cloud/webhook_receiver (task 4.1 / 5.c)
    "constructs>=10.4,<11",     # CDK construct base (companion of aws-cdk-lib)
]
cloud = [
    "aws-lambda-powertools[all]>=3,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2,<3",
    "boto3>=1.35,<2",
    "botocore>=1.35,<2",
    "httpx>=0.27,<0.29",
    "PyJWT[crypto]>=2.9,<3",
    "structlog>=24,<26",
    "trikon==0.5.0",
]

[project.scripts]
trikon = "trikon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trikon", "trikon_cloud"]

# Ship the packaged default policy inside the wheel. Without this,
# `importlib.resources.files("trikon.policy") / "default_policy.yaml"`
# raises FileNotFoundError on `pip install trikon` even though it works
# in a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"trikon/policy/default_policy.yaml" = "trikon/policy/default_policy.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line-too-long handled by formatter

[tool.ruff.lint.per-file-ignores]
# Typer's canonical pattern is `param: T = typer.Option(default, ...)` in the
# function signature. Ruff B008 (function-call-in-default-argument) fires on
# that pattern and every Path.cwd() default we hand to it. The rule does not
# fit Typer — silence it for the CLI module only.
"trikon/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_any_explicit = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["coverage.*", "docker.*", "git.*", "jedi.*", "libcst.*", "unidiff.*", "yaml.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
# `trikon` already covers all submodules; `trikon.verify` is listed
# explicitly so a bare `coverage run` in Phase 2 unambiguously instruments
# the sandbox layer alongside change_intel.
source = ["trikon", "trikon.verify"]
# CDK stack code lives under trikon_cloud/webhook_receiver/infra/ and is
# validated by `cdk synth` (see trikon-cloud-webhook-receiver task 5.c),
# not by unit-test coverage. Exclude it from the coverage measurement so
# the per-file floors in task 5.a apply only to production Python modules.
omit = [
    "trikon_cloud/webhook_receiver/infra/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
# NOTE: `include` and `fail_under` are set per-invocation on the CLI
# (see `.github/workflows/ci.yml`):
#   Phase 1: `coverage report --fail-under=90 --include='trikon/change_intel/*'`
#   Phase 2: `coverage report --fail-under=85 --include='trikon/verify/*'`
# Baking either flag into this shared config caused pytest-cov to
# apply the wrong filter to the wrong phase's tests and report 0.00%
# coverage, failing the pytest step before the explicit `coverage report`
# CLI could run. Leave both flags at the CLI where they belong.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -m 'not perf and not integration'"
markers = [
    "integration: end-to-end tests requiring git / docker / sample_repo",
    "slow: benchmarks and long-running tests",
    "perf: nightly perf benchmarks; opt-in",
]
