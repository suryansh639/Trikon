name: Trikon Verify
description: Run Trikon change-intelligence + verification against a PR diff. Produces a machine-readable Verdict.
branding:
  icon: shield
  color: purple

inputs:
  base:
    description: Base commit SHA (pre-change).
    required: true
  head:
    description: Head commit SHA (post-change).
    required: true
  repo-path:
    description: Path to the repo root inside the checkout. Defaults to `.` (the workflow's working directory).
    required: false
    default: "."
  no-sandbox:
    description: >-
      Run trikon in --no-sandbox mode (subprocesses inside the ephemeral action container, no extra Docker
      isolation). Default "true", because sandbox mode does not work on GitHub-hosted runners: it starts the
      sandbox through the runner's Docker socket and bind-mounts the repo by its in-container path
      (/github/workspace), which the host daemon cannot resolve, so every run fails closed to `require_human`.
      Set "false" only on runners where that path exists on the Docker host (for example some self-hosted runners).
    required: false
    default: "true"
  fail-on:
    description: Comma-separated list of decisions that cause the action to exit non-zero. Default `block` — the action fails only on hard blocks. Set to `block,require_human` for stricter gating.
    required: false
    default: "block"

outputs:
  decision:
    description: The Verdict's `decision` field (`allow`, `block`, `require_human`, or `warn`).
  verdict-json:
    description: Full Verdict as a JSON string.

runs:
  using: docker
  image: Dockerfile
  args:
    - ${{ inputs.base }}
    - ${{ inputs.head }}
    - ${{ inputs.repo-path }}
    - ${{ inputs.no-sandbox }}
    - ${{ inputs.fail-on }}
