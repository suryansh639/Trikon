# Trikon CI — see design.md §9.1 and .kiro/specs/change-intelligence/design.md §Testing Strategy.
#
# This workflow is expected to be RED until Phase 1 lands its full test suite
# (see EXECUTION_PLAN.md Phase 1 tasks 5-10). Once task 14.1 closes, this
# workflow is required-passing on every PR to main.
#
# Note: mypy is scoped to `trikon/change_intel/` in Phase 1. Widening to
# `trikon/evidence/` is deferred until pre-existing `disallow_any_explicit`
# violations in the evidence-report models are cleaned up.
# The `perf` job is added in Task 12.2.

name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly at 06:00 UTC — runs perf-nightly and integration-verify (see Task 14.3).
    - cron: '0 6 * * *'

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check trikon/ tests/
      - run: ruff format --check trikon/ tests/
      - run: mypy --strict trikon/change_intel/
      - run: pytest tests/unit/ --cov=trikon.change_intel --cov-branch --cov-report=xml
      - run: coverage report --fail-under=90 --include='trikon/change_intel/*'

  integration:
    runs-on: ubuntu-latest
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The Sample_Repo_Suite runs inside DEFAULT_SANDBOX_IMAGE. Build it
      # locally so the job never depends on the tag being on Docker Hub yet.
      - name: Build sandbox image tagged from pyproject.toml
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          docker build --load -t "suryansh639/trikon:${VERSION}" -f Dockerfile.sandbox .
      - run: pip install -e ".[dev]"
      - run: pytest tests/integration/ -v -o "addopts=-ra --strict-markers"

  perf:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run always-on benchmarks
        run: pytest tests/benchmarks/ --benchmark-only --benchmark-max-time=60 --no-cov -o "addopts=-ra --strict-markers" -m "slow and not django"

  # Nightly perf gate for the Verification Runner (Phase 2, Task 14.3).
  # Distinct from the Phase-1 `perf` job above, which runs on PRs. No test
  # carries the `perf` marker yet (the verify benchmarks for the wall-clock
  # ceilings in Requirement 8.1 / 8.2 / 8.3 are not written), so `-m perf`
  # alone collected nothing and pytest exited 5. The job selects every `slow`
  # benchmark in tests/benchmarks/ (the Django cases skip unless
  # TRIKON_DJANGO_PATH is set) plus any future `perf` one, with the pinned
  # sandbox image built fresh for the verify benchmarks to use.
  perf-nightly:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: docker/setup-buildx-action@v3
      # setup-buildx-action makes a docker-container builder current, so
      # --load is needed to put the image in the local image store.
      - name: Build sandbox image tagged from pyproject.toml
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          docker build --load -t "suryansh639/trikon:${VERSION}" -f Dockerfile.sandbox .
      - run: pip install -e ".[dev]"
      - name: Run nightly verify perf benchmarks
        run: pytest tests/benchmarks/ -m "slow or perf" --benchmark-only --benchmark-max-time=60 -o "addopts=-ra --strict-markers"

  # Nightly integration tests for `trikon/verify/**` (Task 14.3).
  # Requires a live Docker daemon and the pinned sandbox image; runs the
  # opt-in integration suite that the default `pytest` invocation excludes
  # via the `-m 'not perf and not integration'` addopts in pyproject.toml.
  integration-verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: lint-type-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: docker/setup-buildx-action@v3
      # setup-buildx-action makes a docker-container builder current, so
      # --load is needed to put the image in the local image store.
      - name: Build sandbox image tagged from pyproject.toml
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          docker build --load -t "suryansh639/trikon:${VERSION}" -f Dockerfile.sandbox .
      - run: pip install -e ".[dev]"
      - name: Run verify integration tests
        run: pytest tests/integration/verify/ -m integration -o "addopts=-ra --strict-markers"
