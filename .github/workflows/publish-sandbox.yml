name: Publish sandbox to Docker Hub

# Triggered by pushing a tag matching v* (same trigger as publish.yml).
# Builds Dockerfile.sandbox and pushes to Docker Hub under
# suryansh639/trikon:<version> and suryansh639/trikon:latest.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME  -- Docker Hub username (suryansh639)
#   DOCKERHUB_TOKEN     -- Docker Hub personal access token
#
# The image name is intentionally kept in sync with the trikon package
# version so `pip install trikon==X.Y.Z` and `docker pull
# suryansh639/trikon:X.Y.Z` refer to the same reproducible bundle.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build + push sandbox image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag version
        id: version
        run: |
          # ${GITHUB_REF#refs/tags/v} strips "refs/tags/v" prefix
          echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.sandbox
          push: true
          tags: |
            suryansh639/trikon:${{ steps.version.outputs.value }}
            suryansh639/trikon:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
